<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>DaManhunt | Hunter</title>
</head>

<body>
  <div class="layout">
    <div class="menu">
      <h1 class="highlightHead">Hunter</h1>
    </div>

    <div class="statusCard">
      <h2 id="gameStateText">Loading game state...</h2>
    </div>

    <div class="statusCard" id="finaleCard" style="display: none;">
      <h3><span class="highlightHead">Finale!</span></h3>
      <p id="finaleInfo"></p>
    </div>

    <div class="statusCard" id="catchBtnCard" style="display: none;">
      <button id="catchBtn" class="primaryButton">Target betouched!</button>
    </div>

    <div class="statusCard" id="revealCard" style="display: none;">
      <h3><span class="highlightText">Latest Reveal</span></h3>
      <p id="revealInfo">Waiting for first reveal...</p>
    </div>

    <div class="statusCard" id="historyCard" style="display: none;">
      <h3><span class="highlightText">Past Reveals</span></h3>
      <ul id="historyList" class="objectiveList"></ul>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/hunter.js"></script>
</body>

</html>
