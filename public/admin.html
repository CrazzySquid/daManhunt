<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>DaManhunt | Start Selection</title>
</head>
<body>
  <div class="layout">
  <div class="menu">
    <h1>Game Admin</h1>
  </div>

  <form id="gameForm" class="adminForm">
    <label for="presetSelect">Preset</label>
    <select id="presetSelect">
      <option value="balanced">Balanced</option>
      <option value="hunterFavored">Hunter Favored</option>
      <option value="runnerFavored">Runner Favored</option>
      <option value="debug">Debug</option>
      <option value="custom">Custom</option>
    </select>

    <label for="headStartInput">Head start (minutes)</label>
    <input type="number" id="headStartInput" step="0.1" min="0" required>

    <label for="roundDurationInput">Round duration (minutes)</label>
    <input type="number" id="roundDurationInput" step="0.1" min="0" required>

    <label for="objectiveCountInput">Number of objectives</label>
    <input type="number" id="objectiveCountInput" min="1" required>

    <label for="revealIntervalsInput">Reveal schedule (minutes, comma-separated)</label>
    <input type="text" id="revealIntervalsInput" placeholder="20,20,10,10,10,5,5" required>
    <p id="scheduleWarning" class="warningText"></p>

    <button type="submit" class="primaryButton">Start Game</button>
  </form>

  <p id="statusMsg" class="statusText"></p>
</div>

<script>
  let presets = {};

  async function loadPresets() {
    const res = await fetch('/api/presets');
    presets = await res.json();
    applyPreset('balanced');
  }

  function applyPreset(name) {
    if (name === 'custom') return; // leave fields as they are for manual entry
    const p = presets[name];
    if (!p) return;
    document.getElementById('headStartInput').value = p.headStartMinutes;
    document.getElementById('roundDurationInput').value = p.roundDurationMinutes;
    document.getElementById('objectiveCountInput').value = p.objectiveCount;
    document.getElementById('revealIntervalsInput').value = p.revealIntervals.join(',');
  }

  document.getElementById('presetSelect').addEventListener('change', (e) => {
    applyPreset(e.target.value);
  });

  function checkScheduleFits() {
    const roundDuration = parseFloat(document.getElementById('roundDurationInput').value);
    const intervals = document.getElementById('revealIntervalsInput').value
      .split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
    const total = intervals.reduce((a, b) => a + b, 0);
    const warningEl = document.getElementById('scheduleWarning');

    if (!roundDuration || intervals.length === 0) {
      warningEl.textContent = '';
      return;
    }
    if (total > roundDuration) {
      warningEl.textContent = `⚠️ Schedule totals ${total} min, longer than the ${roundDuration} min round.`;
    } else {
      warningEl.textContent = `Schedule totals ${total} of ${roundDuration} min.`;
    }
  }

  document.getElementById('revealIntervalsInput').addEventListener('input', checkScheduleFits);
  document.getElementById('roundDurationInput').addEventListener('input', checkScheduleFits);

  document.getElementById('gameForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const statusEl = document.getElementById('statusMsg');

    const revealIntervals = document.getElementById('revealIntervalsInput').value
      .split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));

    const payload = {
      headStartMinutes: parseFloat(document.getElementById('headStartInput').value),
      roundDurationMinutes: parseFloat(document.getElementById('roundDurationInput').value),
      objectiveCount: parseInt(document.getElementById('objectiveCountInput').value),
      revealIntervals
    };

    try {
      const res = await fetch('/api/game/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) {
        statusEl.textContent = 'Error: ' + (data.error || 'unknown');
        return;
      }
      statusEl.textContent = `Game started at ${new Date(data.started).toLocaleTimeString()}`;
    } catch (err) {
      statusEl.textContent = 'Request failed: ' + err.message;
    }
  });

  loadPresets();
</script>
</body>
</html>
