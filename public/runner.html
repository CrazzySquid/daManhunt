<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>DaManhunt | Start Selection</title>
</head>
<body>
  <h1>Runner Tracker</h1>
  <p style="color: red; font-weight: bold;">⚠️ Keep this tab open and screen on!</p>
  <p id="status">Initializing location updates...</p>

  <script>
    const params = new URLSearchParams(window.location.search);
    const runnerId = 'runners';
    const statusEl = document.getElementById('status');

    function updateStatus(message) {
      statusEl.textContent = message;
    }

    let wakeLock = null;

    async function requestWakeLock() {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => console.log('Wake lock released'));
      } catch (err) {
        console.error('Wake lock failed:', err);
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        requestWakeLock();
      }
    });

    requestWakeLock();

    function sendPing() {
      navigator.geolocation.getCurrentPosition(pos => {
        fetch('/api/ping', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({
    runner_id: runnerId,
    lat: pos.coords.latitude,
    lng: pos.coords.longitude,
    accuracy: pos.coords.accuracy
  })
}).then(async res => {
  if (res.status === 403) {
    updateStatus('⚠️ No game running — ping not sent.');
    return;
  }
  if (!res.ok) {
    updateStatus('Ping failed (server error).');
    return;
  }
  updateStatus(`Last ping sent at ${new Date().toLocaleTimeString()}`);
}).catch(err => {
  console.error('Ping error:', err);
  updateStatus('Failed to send ping.');
});
    }

    sendPing();
    setInterval(sendPing, 10000);
  </script>

  <h2>Your Objectives</h2>
<ul id="objectivesList"></ul>

<script>
  async function loadObjectives() {
    const res = await fetch('/api/objectives');
    const objectives = await res.json();
    const list = document.getElementById('objectivesList');
    list.innerHTML = '';
    objectives.forEach(o => {
      const li = document.createElement('li');
      li.textContent = `${o.name} `;
      if (o.visited) {
        li.textContent += '✅';
      } else {
        const btn = document.createElement('button');
        btn.textContent = "I'm here";
        btn.onclick = () => {
          fetch(`/api/objectives/${o.id}/visit`, { method: 'POST' }).then(loadObjectives);
        };
        li.appendChild(btn);
      }
      list.appendChild(li);
    });
  }
  loadObjectives();
</script>
</body>
</html>
