<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>DaManhunt | Runner</title>
</head>

<body>
  <div class="cornerNote" id="pingNote">Last ping: —</div>
  <div class="cornerNote" id="wakeNote" style="top: 2.2rem;">🔒 Checking...</div>

  <div class="layout">
    <div class="menu">
      <h1 class="highlightHead">Runner</h1>
    </div>

    <div class="statusCard">
      <h2 id="gameStateText">Loading game state...</h2>
    </div>

    <div class="statusCard" id="revealCard" style="display: none;">
      <h3><span class="highlightText">Last Reveal</span></h3>
      <p id="revealInfo">No reveal yet.</p>
    </div>

    <div class="statusCard" id="objectivesCard" style="display: none;">
      <h3><span class="highlightText">Objectives</span></h3>
      <ul id="objectivesList" class="objectiveList"></ul>
    </div>

    <div class="statusCard">
      <h3><span class="highlightText">Map</span></h3>
      <p class="mapPlaceholder">🗺️ Map view coming soon.</p>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/runner.js"></script>
</body>

</html>
